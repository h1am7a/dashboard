<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Priest Life &mdash; Health &amp; Habits</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Genuine Apple SF Pro Fonts & Local CSS -->
  <link rel="stylesheet" href="/assets/style.css">

  <style>
    /* iOS 18 True Dark Mode (Pure OLED Black) */
    /* Essential fail-safe & layout rules */
    .w-full { width: 100% !important; }
    .h-full { height: 100% !important; }
    .flex { display: flex !important; }
    .inline-flex { display: inline-flex !important; }
    .grid { display: grid !important; }
    .grid-cols-2 { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 12px !important; }
    .flex-col { flex-direction: column !important; }
    .flex-1 { flex: 1 1 0% !important; }
    .flex-shrink-0 { flex-shrink: 0 !important; }
    .items-center { align-items: center !important; }
    .items-baseline { align-items: baseline !important; }
    .justify-between { justify-content: space-between !important; }
    .justify-center { justify-content: center !important; }
    .gap-1 { gap: 4px !important; }
    .gap-1\.5 { gap: 6px !important; }
    .gap-2 { gap: 8px !important; }
    .gap-3 { gap: 12px !important; }
    .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: 8px !important; }
    .space-y-2\.5 > :not([hidden]) ~ :not([hidden]) { margin-top: 10px !important; }
    .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 12px !important; }

    /* SVG safety constraints */
    svg { display: inline-block; vertical-align: middle; }
    .ios-tab-bar svg { width: 22px !important; height: 22px !important; min-width: 22px !important; min-height: 22px !important; max-width: 22px !important; max-height: 22px !important; flex-shrink: 0 !important; }
    .w-5 { width: 20px !important; }
    .h-5 { height: 20px !important; }
    .w-6 { width: 24px !important; }
    .h-6 { height: 24px !important; }
    .w-4 { width: 16px !important; }
    .h-4 { height: 16px !important; }
    .w-2\.5 { width: 10px !important; }
    .h-2\.5 { height: 10px !important; }

    :root {
      --bg-system: #000000;                      /* True OLED Black Canvas */
      --bg-secondary: #1C1C1E;                   /* Apple Widget Dark Charcoal */
      --bg-tertiary: #2C2C2E;                    /* Inset Surface */
      --label-primary: #FFFFFF;                  /* Primary White */
      --label-secondary: #8E8E93;                /* Classic iOS Gray */
      --label-tertiary: #636366;                 /* Tertiary Gray */
      --separator: rgba(255, 255, 255, 0.08);    /* Hairline 0.5px */
      
      /* Pure Apple HIG Tokens: Authentic iPhone Screen Time Cyan/Blue for Targets & Action Buttons */
      --accent-blue: #32ADE6;                    /* 1:1 Authentic iPhone Screen Time Cyan */
      --accent-green: #30D158;                   /* Green delta */
      --accent-orange: #FF9F0A;                  /* Orange */
      
      /* Data series: Neutral monochrome graphite / silver */
      --chart-neutral: #8E8E93;                  /* Candle / spline neutral data */
      --chart-neutral-active: #FFFFFF;           /* Active / focused candle */
      --chart-grid: rgba(255, 255, 255, 0.10);   /* Grid lines */
      --bubble-bg: #2C2C2E;                      /* Tooltip */
      --bar-bg: rgba(28, 28, 30, 0.88);          /* Translucent Bar */
      --card-border: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      -webkit-appearance: none;
      appearance: none;
    }

    body {
      background-color: #000000;
      color: var(--label-primary);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    svg text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif !important;
    }

    .sf-display {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", sans-serif;
      letter-spacing: -0.022em;
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    /* iOS 18 Squircles */
    .ios-widget-card {
      background: var(--bg-secondary);
      border-radius: 22px;
      border: 0.5px solid var(--card-border);
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    /* Clickable bars and nodes */
    .chart-bar-clickable {
      cursor: pointer;
      transition: fill 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .chart-bar-clickable:hover {
      opacity: 0.85;
    }

    /* Speech bubble tooltip */
    .speech-bubble {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      animation: popIn 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.85) translateY(4px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Screen containers */
    .screen {
      display: none;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 110px;
    }
    .screen.active {
      display: flex;
    }

    .screen-content {
      scrollbar-width: none;
    }
    .screen-content::-webkit-scrollbar {
      display: none;
    }

    .ios-tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--bar-bg);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-top: 0.5px solid var(--separator);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 24px;
      z-index: 40;
    }

    .ios-tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--label-secondary);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .ios-tab-btn.active {
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Skeleton loading */
    .skeleton-box {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.5s infinite;
      border-radius: 12px;
    }
    @keyframes skeletonShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4" onclick="handleGlobalClick(event)">

  <!-- iPhone Max Canvas (390px) -->
  <div class="w-full max-w-[390px] h-screen sm:h-[844px] bg-[var(--bg-system)] sm:rounded-[44px] overflow-hidden flex flex-col relative shadow-2xl border-0 sm:border sm:border-[rgba(255,255,255,0.1)]">
    
    <!-- Top Notch / Dynamic Island Safe Area Spacer -->
    <div class="h-10 w-full flex-shrink-0"></div>

    <!-- Main Screens Container -->
    <div class="flex-1 overflow-y-auto px-4 screen-content relative">
      
      <!-- SCREEN 1: TODAY -->
      <div id="screen-today" class="screen active"></div>

      <!-- SCREEN 2: SLEEP -->
      <div id="screen-sleep" class="screen"></div>

      <!-- SCREEN 3: BODY -->
      <div id="screen-body" class="screen"></div>

    </div>

    <!-- Bottom Tab Navigation Bar (3 Screens: Today, Sleep, Body) -->
    <nav class="ios-tab-bar">
      
      <!-- Tab 1: Today -->
      <div id="btn-today" class="ios-tab-btn active" onclick="switchTab('today')">
        <svg width="22" height="22" style="width:22px;height:22px;" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Today</span>
      </div>

      <!-- Tab 2: Sleep -->
      <div id="btn-sleep" class="ios-tab-btn" onclick="switchTab('sleep')">
        <svg width="22" height="22" style="width:22px;height:22px;" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <span>Sleep</span>
      </div>

      <!-- Tab 3: Body -->
      <div id="btn-body" class="ios-tab-btn" onclick="switchTab('body')">
        <svg width="22" height="22" style="width:22px;height:22px;" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span>Body</span>
      </div>

    </nav>

  </div>

  <script>
    /* =====================================================================
       STATE & TELEGRAM INTEGRATION
    ===================================================================== */
    let currentTab = 'today';
    let activeBarSelection = null;
    let activeMeasurementSelection = {};
    let selectedWorkoutDayIndex = 6;
    let sleepPeriod = 7;

    let cachedToday = null;
    let cachedSleep = {};
    let cachedBody = null;

    function initTelegram() {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        try {
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          tg.setHeaderColor('#000000');
          tg.setBackgroundColor('#000000');
        } catch (e) {}
      }
    }

    function triggerHaptic(style) {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        try {
          window.Telegram.WebApp.HapticFeedback.impactOccurred(style || 'light');
        } catch (e) {}
      }
    }

    /* =====================================================================
       API CLIENT
    ===================================================================== */
    async function apiRequest(endpoint, method = 'GET', body = null) {
      const initData = window.Telegram?.WebApp?.initData || '';
      const headers = {
        'Accept': 'application/json',
        'X-Init-Data': initData,
        'X-Telegram-Init-Data': initData
      };
      if (body) {
        headers['Content-Type'] = 'application/json';
      }

      const res = await fetch(endpoint, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
      });

      if (!res.ok) {
        let errMessage = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          if (errJson?.error?.message) errMessage = errJson.error.message;
        } catch (e) {}
        throw new Error(errMessage);
      }
      return await res.json();
    }

    function renderErrorState(container, msg, retryFn) {
      container.innerHTML = `
        <div class="ios-widget-card text-center py-10 space-y-3">
          <div class="text-[var(--accent-orange)] text-sm font-semibold">Failed to load data</div>
          <div class="text-xs text-[var(--label-secondary)]">${msg}</div>
          <button onclick="${retryFn}" class="px-4 py-2 rounded-xl text-xs font-semibold bg-[var(--accent-blue)] text-black mt-2 active:scale-95 transition-transform">
            Retry
          </button>
        </div>
      `;
    }

    function renderSkeletonState(container) {
      container.innerHTML = `
        <div class="ios-widget-card space-y-3 h-48 skeleton-box"></div>
        <div class="grid grid-cols-2 gap-3">
          <div class="ios-widget-card h-28 skeleton-box"></div>
          <div class="ios-widget-card h-28 skeleton-box"></div>
        </div>
        <div class="ios-widget-card space-y-2 h-44 skeleton-box"></div>
      `;
    }

    /* =====================================================================
       BADGES & ARROWS
    ===================================================================== */
    function formatDuration(hVal) {
      if (hVal === null || hVal === undefined || isNaN(hVal)) return '';
      const totalMin = Math.round(Number(hVal) * 60);
      const h = Math.floor(Math.abs(totalMin) / 60);
      const m = Math.abs(totalMin) % 60;
      if (h === 0) return `${m}m`;
      if (m === 0) return `${h}h`;
      return `${h}h${m}m`;
    }
    function renderAppleArrowBadge(type, text) {
      if (!text || text === 'no change' || type === 'none') {
        return `<span class="text-[11px] font-medium text-[var(--label-secondary)]">no change</span>`;
      }
      
      const cleanText = String(text).replace(/^[+-]/, '').trim();
      const isDown = type === 'down';
      
      const arrowSvg = isDown
        ? `<svg width="13" height="13" style="width: 13px; height: 13px; display: inline-block; vertical-align: middle; flex-shrink: 0;" viewBox="0 0 16 16" fill="currentColor">
             <path fill-rule="evenodd" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z" clip-rule="evenodd" />
           </svg>`
        : `<svg width="13" height="13" style="width: 13px; height: 13px; display: inline-block; vertical-align: middle; flex-shrink: 0;" viewBox="0 0 16 16" fill="currentColor">
             <path fill-rule="evenodd" d="M16 8A8 8 0 1 0 0 8a8 8 0 0 0 16 0zm-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V11.5z" clip-rule="evenodd" />
           </svg>`;

      return `
        <span style="display: inline-flex; align-items: center; gap: 4px;" class="text-[12px] font-medium text-[var(--label-secondary)]">
          ${arrowSvg}<span>${cleanText}</span>
        </span>
      `;
    }

    /* =====================================================================
       SCREEN 1: TODAY
    ===================================================================== */
    async function loadTodayScreen() {
      const container = document.getElementById('screen-today');
      if (!cachedToday) {
        renderSkeletonState(container);
      }

      try {
        const d = await apiRequest('/api/today');
        cachedToday = d;
        renderToday(d);
      } catch (err) {
        if (!cachedToday) {
          renderErrorState(container, err.message, 'loadTodayScreen()');
        }
      }
    }

    function renderToday(d) {
      const container = document.getElementById('screen-today');

      function getHeatmapColor(pct) {
        if (pct === null) return 'none';
        if (pct === 0) return 'rgba(255, 255, 255, 0.08)';
        if (pct < 50) return 'rgba(255, 255, 255, 0.28)';
        if (pct < 75) return 'rgba(255, 255, 255, 0.55)';
        if (pct < 100) return 'rgba(255, 255, 255, 0.80)';
        return '#FFFFFF';
      }

      // Align grid by weeks starting from Monday.
      // If the first day of the period is not Monday — cut it off (trim it), rather than shifting columns.
      const rawHitmap = d.hitmap || [];
      let firstMon = 0;
      while (firstMon < rawHitmap.length) {
        const dt = new Date(rawHitmap[firstMon].day + 'T00:00:00');
        if (dt.getDay() === 1) break; // 1 = Monday
        firstMon++;
      }
      const alignedList = rawHitmap.slice(firstMon);

      // Group aligned days into weeks of 7 days (Monday..Sunday)
      const weeks = [];
      for (let i = 0; i < alignedList.length; i += 7) {
        weeks.push(alignedList.slice(i, i + 7));
      }

      const heatmapColsHtml = weeks.map(weekDays => {
        const paddedDays = [...weekDays];
        while (paddedDays.length < 7) {
          paddedDays.push(null);
        }
        const cellsHtml = paddedDays.map(item => {
          if (!item) {
            return `<div style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: transparent;"></div>`;
          }
          const isToday = item.day === d.day;
          const hasWorkout = Boolean(item.has_workout);
          const ringStyle = (isToday && hasWorkout) ? 'box-shadow: 0 0 0 1px #FFFFFF;' : '';
          const workoutDot = hasWorkout ? `<div style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #8E8E93;"></div>` : '';

          if (item.percent === null) {
            return `<div title="${item.day}: No data" style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: transparent; border: 0.5px solid var(--separator); display: flex; align-items: center; justify-content: center; ${ringStyle}">${workoutDot}</div>`;
          }
          const bg = getHeatmapColor(item.percent);
          return `<div title="${item.day}: ${item.percent}%" style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: ${bg}; display: flex; align-items: center; justify-content: center; ${ringStyle}">${workoutDot}</div>`;
        }).join('');

        return `<div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">${cellsHtml}</div>`;
      }).join('');

      // Month label above the week containing the 1st of the month (prevents collision like 'Jun Jul')
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const monthLabels = weeks.map((week, idx) => {
        let label = '';
        for (const item of week) {
          if (!item) continue;
          if (item.day && item.day.endsWith('-01')) {
            const dObj = new Date(item.day + 'T00:00:00');
            const m = dObj.getMonth();
            const isLatest = idx >= weeks.length - 3;
            label = `<span class="truncate ${isLatest ? 'text-[var(--label-primary)] font-bold' : ''}">${monthNames[m]}</span>`;
            break;
          }
        }
        return label || '<span></span>';
      });

      const monthRowHtml = monthLabels.map(slot => `<div style="flex: 1; text-align: left; overflow: visible; white-space: nowrap;">${slot}</div>`).join('');

      // Checklist items from array
      let itemsHtml = '';
      if (!d.score.items || d.score.items.length === 0) {
        itemsHtml = `<div class="text-xs text-[var(--label-secondary)] py-4 text-center">No checklist items scheduled</div>`;
      } else {
        itemsHtml = d.score.items.map(it => {
          if (it.type === 'habit') {
            return `
              <div class="flex items-center justify-between p-3 rounded-2xl bg-[var(--bg-tertiary)] text-xs border border-[var(--separator)]">
                <div class="flex items-center gap-3">
                  <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold ${it.done ? 'bg-[var(--label-primary)] text-[var(--bg-system)]' : 'border border-dashed border-[var(--label-tertiary)]'}">
                    ${it.done ? '&#10003;' : ''}
                  </span>
                  <span class="${it.done ? 'text-[var(--label-primary)]' : 'text-[var(--label-secondary)]'}">${it.title}</span>
                </div>
              </div>
            `;
          } else {
            const taskId = it.key.replace('task:', '');
            return `
              <div id="task-${taskId}" class="flex items-center justify-between p-3 rounded-2xl bg-[var(--bg-tertiary)] text-xs border border-[var(--separator)]">
                <div class="flex items-center gap-3">
                  <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold ${it.done ? 'bg-[var(--accent-green)] text-black' : 'border border-[var(--label-tertiary)]'}">
                    ${it.done ? '&#10003;' : ''}
                  </span>
                  <span class="${it.done ? 'line-through text-[var(--label-tertiary)]' : 'text-[var(--label-primary)] font-medium'}">${it.title}</span>
                </div>
                <div>
                  ${it.done ?
                    '<span class="text-[11px] font-semibold text-[var(--accent-green)]">Completed</span>' :
                    `<button onclick="markTaskDone(${taskId})" class="px-3 py-1 rounded-full text-xs font-bold bg-[var(--accent-blue)] text-white shadow-sm active:scale-95 transition-transform">Done</button>`
                  }
                </div>
              </div>
            `;
          }
        }).join('');
      }

      // Format date
      let dateFormatted = d.day;
      try {
        const dateParts = d.day.split('-');
        const dObj = new Date(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
        dateFormatted = dObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
      } catch (e) {}

      // Sleep delta badge
      let sleepDeltaHtml = '<span class="text-xs text-[var(--label-tertiary)]">&mdash;</span>';
      if (d.sleep && d.sleep.delta_min !== null) {
        const isNeutral = Math.abs(d.sleep.delta_min) <= 60;
        const arrowType = d.sleep.delta_min > 0 ? 'up' : (d.sleep.delta_min < 0 ? 'down' : 'none');
        sleepDeltaHtml = renderAppleArrowBadge(arrowType, `${Math.abs(d.sleep.delta_min)}m`, isNeutral);
      }

      // Mood 3D emoji
      let moodEmoji = '&#128528;';
      let moodLabel = d.mood?.label || '&mdash;';
      if (d.mood?.label === 'Bad') moodEmoji = '&#128577;';
      else if (d.mood?.label === 'Meh') moodEmoji = '&#128528;';
      else if (d.mood?.label === 'Ok') moodEmoji = '&#128578;';
      else if (d.mood?.label === 'Good') moodEmoji = '&#128522;';
      else if (d.mood?.label === 'Great') moodEmoji = '&#128513;';
      else if (!d.mood?.label) moodEmoji = '&#129488;';

      const isNullScore = d.score.percent === null || d.score.total === 0;
      const statusText = isNullScore ? 'NO DATA' : (d.in_progress ? 'IN PROGRESS' : (d.score.done === d.score.total ? 'COMPLETED' : ''));
      const scoreStr = isNullScore ? '&mdash;' : `${d.score.done} / ${d.score.total}`;

      container.innerHTML = `
        <!-- Today Header -->
        <div class="pt-1">
          <h1 class="text-3xl font-bold tracking-tight text-[var(--label-primary)] sf-display">${d.weekday}</h1>
          <div class="text-xs text-[var(--label-secondary)] mt-0.5">${dateFormatted}</div>
        </div>

        <!-- Activity Pulse Heatmap -->
        <div class="ios-widget-card space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-semibold tracking-wider uppercase text-[var(--label-secondary)]">Activity Pulse</span>
          </div>

          <div class="bg-[var(--bg-system)] p-3 rounded-2xl border border-[var(--separator)] space-y-2">
            <div class="flex gap-2 items-center">
              <div class="w-[12px] flex-shrink-0"></div>
              <div class="flex-1 flex gap-[3px] text-[9px] font-semibold text-[var(--label-secondary)]">
                ${monthRowHtml}
              </div>
            </div>

            <div class="flex gap-2 items-center">
              <div class="w-[12px] flex-shrink-0 flex flex-col justify-between text-[8px] font-medium text-[var(--label-secondary)] h-[78px] pr-0.5">
                <span>M</span>
                <span>W</span>
                <span>F</span>
              </div>

    /* =====================================================================

    async function loadSleepScreen(days = sleepPeriod) {
      sleepPeriod = days;
      const container = document.getElementById('screen-sleep');
      if (!cachedSleep[days]) {
        renderSkeletonState(container);
      }

      try {
        const d = await apiRequest(`/api/sleep?days=${days}`);
        cachedSleep[days] = d;
        renderSleep(d, days);
      } catch (err) {
        if (!cachedSleep[days]) {
          renderErrorState(container, err.message, `loadSleepScreen(${days})`);
        }
      }
    }

    function renderSleep(d, periodDays) {
      const container = document.getElementById('screen-sleep');

      function generateSmoothSpline(pts) {
        if (!pts || pts.length < 2) return '';
        let path = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i === 0 ? 0 : i - 1];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const cp1x = p1.x + (p2.x - p0.x) / 5;
          const cp1y = p1.y + (p2.y - p0.y) / 5;
          const cp2x = p2.x - (p3.x - p1.x) / 5;
          const cp2y = p2.y - (p3.y - p1.y) / 5;
          path += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x} ${p2.y}`;
        }
        return path;
      }

      const svgW = 340;
      const svgH = 118;
      const chartBottom = 92;
      const chartTop = 22;
      const usableH = chartBottom - chartTop;

      const seriesCount = d.series ? d.series.length : 0;
      const isDense = seriesCount > 15;
      const isMedium = seriesCount > 7;
      const barWidth = seriesCount <= 7 ? 24 : (seriesCount <= 30 ? 6 : 2);
      const leftMargin = 16;
      const rightMargin = 32;
      const plotWidth = svgW - leftMargin - rightMargin;
      const stepX = seriesCount > 1 ? plotWidth / (seriesCount - 1) : plotWidth / 2;

      const isDurationSelected = activeBarSelection && activeBarSelection.chart === 'sleep' && d.series && d.series[activeBarSelection.index];
      const selectedItem = isDurationSelected ? d.series[activeBarSelection.index] : null;

      // 1. SLEEP DURATION
      const slFloor = 4.0;
      const slMax = 10.0;
      const targetS = d.target_hours || 7.5;
      const targetY_S = Math.round(chartBottom - ((targetS - slFloor) / (slMax - slFloor)) * usableH);
      const firstBarLeft = seriesCount > 0 ? Math.round(leftMargin - barWidth / 2) : leftMargin;
      const lastBarRight = seriesCount > 0 ? Math.round(leftMargin + (seriesCount - 1) * stepX + barWidth / 2) : (svgW - 24);

      const dayLetters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const slBarsSvg = (d.series || []).map((item, i) => {
        const x = Math.round(leftMargin + i * stepX);
        let labelText = '';
        if (item.day) {

            const dt = new Date(item.day + 'T00:00:00');
            labelText = dayLetters[dt.getDay()];
          } else if (i % 7 === 0) {
            labelText = item.day.split('-')[2];
          }
        }

        const isSelected = isDurationSelected && activeBarSelection.index === i;
        const hitWidth = Math.max(14, Math.round(stepX));

        let rectSvg = '';
        if (item.hours !== null && item.hours !== undefined) {

          const y = chartBottom - h;
          const fill = isSelected ? 'var(--chart-neutral-active)' : 'var(--chart-neutral)';
          rectSvg = `<rect x="${x - barWidth/2}" y="${y}" width="${barWidth}" height="${h}" rx="${barWidth > 8 ? 4 : 1}" fill="${fill}" />`;
        }

              <rect x="${bX}" y="${bY}" width="${bW}" height="${bH}" rx="5" fill="var(--bubble-bg)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />

      let durationDisplay = d.avg_hours ? formatDuration(d.avg_hours) : '&mdash;';

      const wkSplinePath = generateSmoothSpline(wkPts);

        if (p.day) {

      const lastWakePoint = wkPts.length ? wkPts[wkPts.length - 1] : null;

              <text x="${svgW - 4}" y="${chartTop + 4}" fill="var(--label-secondary)" font-size="9" text-anchor="end" class="num">09:00</text>
              <text x="${svgW - 4}" y="${chartBottom + 1}" fill="var(--label-secondary)" font-size="9" text-anchor="end" class="num">06:00</text>
              
              <line x1="16" y1="${chartBottom}" x2="${svgW - 24}" y2="${chartBottom}" stroke="var(--chart-grid)" stroke-width="1" shape-rendering="crispEdges" />
              <line x1="16" y1="${chartTop}" x2="${svgW - 24}" y2="${chartTop}" stroke="var(--chart-grid)" stroke-dasharray="2 3" stroke-width="0.8" shape-rendering="crispEdges" />
              <path d="${wkSplinePath}" fill="none" stroke="var(--chart-neutral)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="16" y1="${targetY_W}" x2="${svgW - 24}" y2="${targetY_W}" stroke="var(--accent-blue)" stroke-dasharray="7 4" stroke-width="1.6" shape-rendering="crispEdges" style="pointer-events: none;" />
              ${wkNodesSvg}
            </svg>
          </div>
        </div>

        <!-- 3. BED TIME CARD -->
        <div class="ios-widget-card space-y-2">
          <div class="text-[13px] font-medium text-[var(--label-secondary)]">Bed Time</div>
          <div class="flex items-baseline justify-between">
            <div>
              <span class="text-3xl font-bold text-[var(--label-primary)] num tracking-tight">${bedDisplay}</span>
              <div class="text-[11px] text-[var(--label-secondary)] font-medium mt-0.5">
                Target: <span class="text-[var(--accent-blue)] font-semibold">${targetB_str}</span> &bull; <span class="text-[var(--label-tertiary)]">${bedSub}</span>
              </div>
            </div>
            ${bedBadge}
          </div>

          <div class="w-full h-[124px] relative pt-1">
            <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-full overflow-visible">
              <text x="${svgW - 4}" y="${chartTop + 4}" fill="var(--label-secondary)" font-size="9" text-anchor="end" class="num">01:30</text>
              <text x="${svgW - 4}" y="${chartBottom + 1}" fill="var(--label-secondary)" font-size="9" text-anchor="end" class="num">22:00</text>
              
              <line x1="16" y1="${chartBottom}" x2="${svgW - 24}" y2="${chartBottom}" stroke="var(--chart-grid)" stroke-width="1" shape-rendering="crispEdges" />
              <line x1="16" y1="${chartTop}" x2="${svgW - 24}" y2="${chartTop}" stroke="var(--chart-grid)" stroke-dasharray="2 3" stroke-width="0.8" shape-rendering="crispEdges" />
              <path d="${bdSplinePath}" fill="none" stroke="var(--chart-neutral)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="16" y1="${targetY_B}" x2="${svgW - 24}" y2="${targetY_B}" stroke="var(--accent-blue)" stroke-dasharray="7 4" stroke-width="1.6" shape-rendering="crispEdges" style="pointer-events: none;" />
              ${bdNodesSvg}
            </svg>
          </div>
        </div>
      `;
    }

    /* =====================================================================
       SCREEN 3: BODY
    ===================================================================== */
    async function loadBodyScreen() {
      const container = document.getElementById('screen-body');
      if (!cachedBody) {
        renderSkeletonState(container);
      }

      try {
        if (!cachedToday) {
          try {
            cachedToday = await apiRequest('/api/today');
          } catch (e) {}
        }
        const d = await apiRequest('/api/body');
        cachedBody = d;
        renderBody(d);
      } catch (err) {
        if (!cachedBody) {
          renderErrorState(container, err.message, 'loadBodyScreen()');
        }
      }
    }

    function renderBody(d) {
      const container = document.getElementById('screen-body');

      function generateSmoothSpline(pts) {
        if (pts.length === 0) return '';
        if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
        let path = `M ${pts[0].x} ${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = i > 0 ? pts[i - 1] : pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = i < pts.length - 2 ? pts[i + 2] : p2;
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
        }
        return path;
      }

      function formatShortDate(iso) {
        if (!iso) return '';
        try {
          const dt = new Date(iso + 'T00:00:00');
          return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        } catch (e) {
          return iso;
        }
      }

      function renderMeasurementCard(m, isWide = false) {
        if (!m) return '';
        let displayLabel = m.label || (m.kind === 'waist' ? 'Waist' : m.kind === 'biceps_r' ? 'Biceps' : m.kind === 'forearm_r' ? 'Forearm' : m.kind);
        displayLabel = displayLabel.replace(' (R)', '');

        const history = m.history || [];
        const histLen = history.length;
        const firstEntry = histLen > 0 ? history[0] : null;
        const latestEntry = histLen > 0 ? history[histLen - 1] : null;

        // Delta between first (leftmost) and latest (rightmost) entry
        let deltaVal = null;
        if (histLen > 1 && firstEntry && latestEntry) {
          deltaVal = Math.round((latestEntry.value - firstEntry.value) * 10) / 10;
        }

        let deltaBadge = '<span class="text-xs text-[var(--label-tertiary)]">&mdash;</span>';
        if (deltaVal !== null) {
          if (deltaVal !== 0) {
            const dir = deltaVal > 0 ? 'up' : 'down';
            deltaBadge = renderAppleArrowBadge(dir, `${Math.abs(deltaVal)} ${m.unit || 'cm'}`);
          } else {
            deltaBadge = '<span class="text-[11px] font-semibold text-[var(--label-secondary)]">no change</span>';
          }
        } else if (histLen === 1) {
          deltaBadge = '<span class="text-[11px] font-semibold text-[var(--label-secondary)]">first entry</span>';
        }

        // Selection state
        const selIdx = activeMeasurementSelection[m.kind];
        const isPointSelected = (selIdx !== undefined && selIdx !== null && history[selIdx]);
        const activeEntry = isPointSelected ? history[selIdx] : latestEntry;

        const valStr = activeEntry ? `${activeEntry.value} ${m.unit || 'cm'}` : 'no data';
        const dateSub = isPointSelected ? formatShortDate(activeEntry.date) : (latestEntry ? formatShortDate(latestEntry.date) : (m.cadence || 'weekly'));

        // Chart dimensions with room for top speech bubbles, Y-axis size labels, and X-axis date labels
        const svgW = isWide ? 316 : 144;
        const svgH = 82;
        const chartTop = 22;
        const chartBottom = 60;
        const usableH = chartBottom - chartTop;
        const padX = isWide ? 16 : 12;
        const rightLabelW = isWide ? 34 : 28;
        const plotW = svgW - padX - rightLabelW;

        let chartSvg = '';
        if (histLen === 0) {
          chartSvg = `<line x1="0" y1="${svgH/2}" x2="${svgW}" y2="${svgH/2}" stroke="var(--chart-grid)" stroke-width="1" stroke-dasharray="2 2"/>`;
        } else if (histLen === 1) {
          const x = padX + plotW / 2;
          const y = chartBottom - usableH / 2;
          chartSvg = `<circle cx="${x}" cy="${y}" r="4" fill="var(--chart-neutral)" stroke="var(--bg-secondary)" stroke-width="1.5"/>`;
        } else {
          const vals = history.map(h => h.value);
          const min = Math.min(...vals);
          const max = Math.max(...vals);

          // Pretty integer Y labels (size labels)
          let topSizeNum = Math.ceil(max);
          let bottomSizeNum = Math.floor(min);
          if (topSizeNum === bottomSizeNum) {
            topSizeNum += 1;
            bottomSizeNum -= 1;
          }
          const topSizeLabel = `${topSizeNum}cm`;
          const bottomSizeLabel = `${bottomSizeNum}cm`;

          const plotMin = bottomSizeNum;
          const plotMax = topSizeNum;
          const plotSpan = (plotMax - plotMin) || 1.0;

          const stepX = plotW / (histLen - 1);

          const pts = history.map((h, i) => {
            const x = Math.round(padX + i * stepX);
            const clamped = Math.max(plotMin, Math.min(plotMax, h.value));
            const y = Math.round(chartBottom - ((clamped - plotMin) / plotSpan) * usableH);
            return { x, y, date: h.date, value: h.value, index: i };
          });

          const pathD = generateSmoothSpline(pts);
          const hitW = Math.max(22, Math.round(stepX));

          // Grid lines and Y size labels
          const gridSvg = `
            <text x="${svgW - 2}" y="${chartTop + 3}" fill="var(--label-secondary)" font-size="8.5" text-anchor="end" class="num">${topSizeLabel}</text>
            <text x="${svgW - 2}" y="${chartBottom + 3}" fill="var(--label-secondary)" font-size="8.5" text-anchor="end" class="num">${bottomSizeLabel}</text>
            <line x1="${padX}" y1="${chartTop}" x2="${svgW - rightLabelW + 2}" y2="${chartTop}" stroke="var(--chart-grid)" stroke-dasharray="2 3" stroke-width="0.8" shape-rendering="crispEdges" />
            <line x1="${padX}" y1="${chartBottom}" x2="${svgW - rightLabelW + 2}" y2="${chartBottom}" stroke="var(--chart-grid)" stroke-width="1" shape-rendering="crispEdges" />
          `;

          // Date labels under points
          const dateLabelsSvg = pts.map(p => {
            const isSel = (selIdx === p.index);
            let showLabel = false;
            let dateText = '';
            if (isWide) {
              showLabel = true;
              dateText = formatShortDate(p.date);
            } else {
              if (p.index === 0 || p.index === Math.floor(histLen / 2) || p.index === histLen - 1) {
                showLabel = true;
                dateText = formatShortDate(p.date);
              }
            }
            if (!showLabel) return '';
            return `<text x="${p.x}" y="74" fill="${isSel ? 'var(--label-primary)' : 'var(--label-secondary)'}" font-size="${isWide ? '8' : '7.5'}" font-weight="${isSel ? '700' : '500'}" text-anchor="middle">${dateText}</text>`;
          }).join('');

          // Interactive points and speech bubbles
          const nodesSvg = pts.map(p => {
            const isSel = (selIdx === p.index);
            const dotFill = isSel ? '#FFFFFF' : 'var(--chart-neutral)';
            const dotR = isSel ? 4.8 : 3.0;
            const dotStroke = isSel ? '#000000' : 'var(--bg-secondary)';
            const dotStrokeW = isSel ? 1.5 : 1.2;

            let bubbleSvg = '';
            if (isSel) {
              const bW = 54;
              const bH = 18;
              const bX = Math.max(2, Math.min(svgW - bW - 2, p.x - bW/2));
              const bY = Math.max(1, p.y - bH - 5);
              bubbleSvg = `
                <g class="speech-bubble" style="pointer-events: none;">
                  <rect x="${bX}" y="${bY}" width="${bW}" height="${bH}" rx="4" fill="var(--bubble-bg)" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
                  <polygon points="${p.x - 3},${bY + bH} ${p.x + 3},${bY + bH} ${p.x},${bY + bH + 3}" fill="var(--bubble-bg)" />
                  <text x="${bX + bW/2}" y="${bY + 12.5}" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" class="num">${p.value} ${m.unit || 'cm'}</text>
                </g>
              `;
            }

            return `
              <g onclick="handleMeasurementClick('${m.kind}', ${p.index}, event)" class="cursor-pointer" style="cursor: pointer;">
                <circle cx="${p.x}" cy="${p.y}" r="${dotR}" fill="${dotFill}" stroke="${dotStroke}" stroke-width="${dotStrokeW}" />
                <rect x="${p.x - hitW/2}" y="0" width="${hitW}" height="${svgH}" fill="transparent" class="cursor-pointer" style="cursor: pointer;" />
                ${bubbleSvg}
              </g>
            `;
          }).join('');

          chartSvg = `
            ${gridSvg}
            <path d="${pathD}" fill="none" stroke="var(--chart-neutral)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            ${dateLabelsSvg}
            ${nodesSvg}
          `;
        }

        return `
          <div class="ios-widget-card p-3.5 flex flex-col justify-between space-y-2" style="min-height: 140px;">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold tracking-wider uppercase text-[var(--label-secondary)]">${displayLabel}</span>
              <span class="text-[10px] ${isPointSelected ? 'text-white font-bold' : 'text-[var(--label-tertiary)]'}">${dateSub}</span>
            </div>
            <div class="flex items-baseline justify-between">
              <span class="${isWide ? 'text-2xl' : 'text-xl'} font-bold tracking-tight text-[var(--label-primary)] num">${valStr}</span>
              ${deltaBadge}
            </div>
            <div class="w-full h-[82px] relative pt-0.5">
              <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-full overflow-visible">${chartSvg}</svg>
            </div>
          </div>
        `;
      }

      const waist = (d.measurements || []).find(m => m.kind === 'waist') || {
        kind: 'waist', label: 'Waist', cadence: 'weekly', unit: 'cm', latest: null, history: []
      };
      const biceps = (d.measurements || []).find(m => m.kind === 'biceps_r') || {
        kind: 'biceps_r', label: 'Biceps', cadence: 'monthly', unit: 'cm', latest: null, history: []
      };
      const forearm = (d.measurements || []).find(m => m.kind === 'forearm_r') || {
        kind: 'forearm_r', label: 'Forearm', cadence: 'monthly', unit: 'cm', latest: null, history: []
      };

      // Workouts week strip (last 7 days, aligned with Moscow logical day from /api/today)
      const dayLetters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const todayIso = (cachedToday && cachedToday.day) ? cachedToday.day : new Date().toISOString().substring(0, 10);
      const baseDate = new Date(todayIso + 'T00:00:00');
      const workoutsList = d.workouts || [];

      const workoutDays = Array.from({ length: 7 }, (_, i) => {
        const dObj = new Date(baseDate);
        dObj.setDate(baseDate.getDate() - (6 - i));
        const y = dObj.getFullYear();
        const m = String(dObj.getMonth() + 1).padStart(2, '0');
        const dt = String(dObj.getDate()).padStart(2, '0');
        const iso = `${y}-${m}-${dt}`;
        const wo = workoutsList.find(w => w.date === iso);
        return {
          dayLetter: dayLetters[dObj.getDay()],
          date: iso,
          workout: wo,
          isToday: iso === todayIso
        };
      });

      const stripHtml = workoutDays.map((wDay, idx) => {
        const isSelected = selectedWorkoutDayIndex === idx;
        const hasWo = !!wDay.workout;

        let circleClass = 'border border-[var(--separator)] text-transparent';
        if (hasWo) {
          circleClass = isSelected ? 'bg-white text-black font-bold shadow-sm' : 'bg-[var(--chart-neutral)] text-black font-bold shadow-sm';
        } else if (isSelected) {
          circleClass = 'border-2 border-white text-transparent';
        }

        return `
          <div onclick="selectWorkoutDay(${idx})" class="flex-1 flex flex-col items-center gap-1.5 cursor-pointer">
            <span class="text-[11px] ${isSelected ? 'text-white font-bold' : (hasWo ? 'text-[var(--label-primary)]' : 'text-[var(--label-secondary)]')}">${wDay.dayLetter}</span>
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${circleClass}">
              ${hasWo ? '&#10003;' : ''}
            </div>
          </div>
        `;
      }).join('');

      const selDay = workoutDays[selectedWorkoutDayIndex] || workoutDays[6];
      let detailHtml = '<div class="text-xs text-[var(--label-secondary)] py-2 text-center">Rest day &mdash; no workout scheduled</div>';
      if (selDay && selDay.workout) {
        const w = selDay.workout;
        if (w.note) {
          const rawLines = w.note.includes('\n')
            ? w.note.split('\n')
            : w.note.split(/[,;]|\s—\s/).map(s => s.trim());
          const lines = rawLines.map(s => s.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
          
          detailHtml = `
            <div class="space-y-1.5 pt-1">
              ${lines.map(line => `
                <div class="flex items-start gap-2 text-xs text-[var(--label-primary)] leading-relaxed">
                  <span class="text-[var(--accent-blue)] text-sm leading-none select-none mt-0.5">&bull;</span>
                  <span>${line}</span>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          detailHtml = '<div class="text-xs text-[var(--label-secondary)] py-1">Workout completed</div>';
        }
      } else if (workoutsList.length === 0) {
        detailHtml = '<div class="text-xs text-[var(--label-secondary)] py-2 text-center">No workouts logged yet</div>';
      }

      container.innerHTML = `
        <!-- Body Header -->
        <div class="flex items-baseline justify-between pt-1">
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-[var(--label-primary)] sf-display">Body</h1>
            <div class="text-xs text-[var(--label-secondary)] mt-0.5">Workouts &amp; Measurements</div>
          </div>
        </div>

        <!-- 3 Measurement Cards: WAIST wide, then BICEPS & FOREARM row -->
        <div class="space-y-3">
          ${renderMeasurementCard(waist, true)}
          <div class="grid grid-cols-2 gap-3">
            ${renderMeasurementCard(biceps, false)}
            ${renderMeasurementCard(forearm, false)}
          </div>
        </div>

        <!-- Workout Strip -->
        <div class="ios-widget-card space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-semibold tracking-wider uppercase text-[var(--label-secondary)]">Weekly Workouts</span>
            <span class="text-xs text-[var(--label-tertiary)]">${selDay ? new Date(selDay.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''}</span>
          </div>
          <div class="flex justify-between items-center py-1">
            ${stripHtml}
          </div>
          <div class="pt-2 border-t border-[var(--separator)]">
            ${detailHtml}
          </div>
        </div>
      `;
    }

    /* =====================================================================
       INTERACTION HANDLERS
    ===================================================================== */
    function switchTab(tab) {
      triggerHaptic('light');
      currentTab = tab;
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.ios-tab-btn').forEach(el => el.classList.remove('active'));

      const targetScreen = document.getElementById(`screen-${tab}`);
      if (targetScreen) targetScreen.classList.add('active');

      const targetTabBtn = document.getElementById(`btn-${tab}`);
      if (targetTabBtn) targetTabBtn.classList.add('active');

      activeBarSelection = null;
      activeMeasurementSelection = {};

      if (tab === 'today') loadTodayScreen();
      if (tab === 'sleep') loadSleepScreen(sleepPeriod);
      if (tab === 'body') loadBodyScreen();
    }

    function selectPeriod(days) {
      triggerHaptic('selectionChanged');
      loadSleepScreen(days);
    }

    function handleBarClick(chart, index, event) {
      if (event) event.stopPropagation();
      triggerHaptic('light');
      if (activeBarSelection && activeBarSelection.chart === chart && activeBarSelection.index === index) {
        activeBarSelection = null;
      } else {
        activeBarSelection = { chart, index };
      }
      if (cachedSleep[sleepPeriod]) {
        renderSleep(cachedSleep[sleepPeriod], sleepPeriod);
      }
    }

    function handleMeasurementClick(kind, index, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      triggerHaptic('light');
      if (activeMeasurementSelection[kind] === index) {
        delete activeMeasurementSelection[kind];
      } else {
        activeMeasurementSelection[kind] = index;
      }
      if (cachedBody) {
        renderBody(cachedBody);
      }
    }

    function handleGlobalClick(event) {
      let changed = false;
      if (activeBarSelection !== null) {
        activeBarSelection = null;
        changed = true;
        if (cachedSleep[sleepPeriod]) {
          renderSleep(cachedSleep[sleepPeriod], sleepPeriod);
        }
      }
      if (Object.keys(activeMeasurementSelection).length > 0) {
        activeMeasurementSelection = {};
        changed = true;
        if (cachedBody) {
          renderBody(cachedBody);
        }
      }
    }

    function selectWorkoutDay(idx) {
      triggerHaptic('selectionChanged');
      selectedWorkoutDayIndex = idx;
      if (cachedBody) {
        renderBody(cachedBody);
      }
    }

    async function markTaskDone(taskId) {
      triggerHaptic('medium');
      const taskEl = document.getElementById(`task-${taskId}`);
      if (taskEl) {
        taskEl.style.opacity = '0.4';
      }

      try {
        await apiRequest(`/api/tasks/${taskId}/done`, 'POST');
        const d = await apiRequest('/api/today');
        cachedToday = d;
        renderToday(d);
      } catch (err) {
        alert('Failed to mark task done: ' + err.message);
        if (taskEl) taskEl.style.opacity = '1.0';
      }
    }

    // Initial boot
    document.addEventListener('DOMContentLoaded', () => {
      initTelegram();
      loadTodayScreen();
    });
  </script>
</body>
</html>
